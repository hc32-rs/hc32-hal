[package]
name = "hc32-ddl-hal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hardware abstraction layer for HC32 DDL-series microcontrollers"

[dependencies]
hc32-metapac = { version = "0.1.0", path = "../../hc32-metapac", optional = true }
embedded-hal = "1.0"
embedded-hal-nb = "1.0"

[features]
rt = ["hc32-metapac/rt"]
memory-x = ["hc32-metapac/memory-x"]

# 芯片选择 feature：转发到 PAC，一次只能启用一个。
hc32l110b4pa = ["dep:hc32-metapac", "hc32-metapac/hc32l110b4pa", "hc32l110"]
hc32l110b6pa = ["dep:hc32-metapac", "hc32-metapac/hc32l110b6pa", "hc32l110"]
hc32l110b6ya = ["dep:hc32-metapac", "hc32-metapac/hc32l110b6ya", "hc32l110"]
hc32l110c4pa = ["dep:hc32-metapac", "hc32-metapac/hc32l110c4pa", "hc32l110", "hc32l110-full-pins"]
hc32l110c4ua = ["dep:hc32-metapac", "hc32-metapac/hc32l110c4ua", "hc32l110", "hc32l110-full-pins"]
hc32l110c6pa = ["dep:hc32-metapac", "hc32-metapac/hc32l110c6pa", "hc32l110", "hc32l110-full-pins"]
hc32l110c6ua = ["dep:hc32-metapac", "hc32-metapac/hc32l110c6ua", "hc32l110", "hc32l110-full-pins"]

# 内部派生 feature：HC32L110 系列公共代码。
hc32l110 = []
# 20 引脚封装相对 16 引脚封装多引出 P03/P32/P33/P34。
hc32l110-full-pins = []
